# ============================================================
# Configuração do broker Mosquitto para o SenseControl
# ============================================================
# Configuração simplificada para ambiente de desenvolvimento/demonstração
# acadêmica: conexão sem TLS e sem autenticação por usuário/senha no
# broker (o listener escuta na porta padrão 1883).
#
# Isso é aceitável para o escopo do MVP (rede local/demonstração), mas
# NÃO deve ser usado em produção. A documentação técnica do projeto
# (seção 13 - Segurança) recomenda MQTT sobre TLS e credenciais por
# dispositivo para um cenário real; isso fica registrado como item do
# roadmap futuro (docs/ROADMAP.md).

listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
